name: Build Caça à Arte Scout Windows

on:
  workflow_dispatch:
  push:
    paths:
      - 'scout/**'
      - '.github/workflows/build-windows.yml'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller certifi truststore rapidfuzz
      - name: Build Windows application
        run: |
          pyinstaller --noconfirm --clean --onedir --name "Caca a Arte Scout" --paths scout --hidden-import scout_engine.database --hidden-import scout_engine.adapters --hidden-import scout_engine.normalization --hidden-import scout_engine.extraction scout/Caca_Arte_Scout.py
      - name: Add portable instructions
        shell: pwsh
        run: |
          @"
          CACA A ARTE SCOUT
          Windows portable package
          
          1. Extract this entire folder to a location you can write to.
          2. Run Caca a Arte Scout.exe.
          3. The app opens in your browser at http://127.0.0.1:8766.
          
          Keep the entire folder together. The data folder and history are local.
          "@ | Set-Content "dist/Caca a Arte Scout/LEIA-ME.txt" -Encoding UTF8
      - name: Package ZIP
        run: Compress-Archive -Path "dist/Caca a Arte Scout" -DestinationPath "Caça à Arte Scout Windows.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: Caca-Arte-Scout-Windows
          path: Caça à Arte Scout Windows.zip
          retention-days: 30
