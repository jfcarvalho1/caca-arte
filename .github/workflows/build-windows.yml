name: Build Windows Installer

on:
  push:
    paths:
      - 'scout/**'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scout/requirements.txt
          pip install pyinstaller truststore
      - name: Run tests
        shell: pwsh
        run: |
          if (Test-Path scout/tests) { python -m unittest discover -s scout/tests -v }
      - name: Build app
        run: |
          pyinstaller --noconfirm --clean --onedir --name "CacaArteScout" --paths scout --collect-all rapidfuzz --hidden-import truststore scout/Caca_Arte_Scout.py
      - name: Create installer
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          $app = Join-Path $PWD "dist/CacaArteScout"
          @'
          [Setup]
          AppName=Caça à Arte Scout
          AppVersion=0.4.5
          DefaultDirName={localappdata}\Caça à Arte Scout
          DefaultGroupName=Caça à Arte Scout
          OutputDir=installer
          OutputBaseFilename=Instalar_Caca_Arte_Scout
          PrivilegesRequired=lowest
          Compression=lzma
          SolidCompression=yes
          WizardStyle=modern

          [Files]
          Source: "dist\CacaArteScout\*"; DestDir: "{app}"; Flags: recursesubdirs createallsubdirs

          [Icons]
          Name: "{userdesktop}\Caça à Arte Scout"; Filename: "{app}\CacaArteScout.exe"
          Name: "{userprograms}\Caça à Arte Scout"; Filename: "{app}\CacaArteScout.exe"

          [Run]
          Filename: "{app}\CacaArteScout.exe"; Description: "Abrir Caça à Arte Scout"; Flags: postinstall nowait
          '@ | Set-Content installer.iss -Encoding ASCII
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: Instalador-Caca-Arte-Scout
          path: installer/Instalar_Caca_Arte_Scout.exe
          retention-days: 30
