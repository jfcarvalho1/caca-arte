name: Diagnostico temporario
on:
  push:
    paths: [".github/workflows/diag-temp.yml"]
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - name: P55 CORS
        run: |
          curl -s -o /dev/null -D - -H "Origin: https://jfcarvalho1.github.io" "https://www.p55.art/collections/cruzeiro-seixas/products.json?limit=1" | grep -i -E "^HTTP|access-control|server|cf-" || true
          curl -s -o /dev/null -D - -H "Origin: https://jfcarvalho1.github.io" "https://www.p55.art/search/suggest.json?q=pomar" | grep -i -E "^HTTP|access-control" || true
      - name: Liliana forms
        run: |
          python3 - <<'PY'
          import urllib.request,re
          ua={"User-Agent":"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36"}
          raw=urllib.request.urlopen(urllib.request.Request("https://www.livrariaalfarrabista.com/",headers=ua),timeout=20).read().decode("utf-8","replace")
          for m in re.finditer(r"<form.*?</form>",raw,re.S|re.I): print("FORM:",re.sub(r"\s+"," ",m.group(0))[:1500])
          print("LINKS:",sorted(set(re.findall(r'href="([^"]*(?:pesq|tipo=|autor|search)[^"]*)"',raw)))[:30])
          PY
