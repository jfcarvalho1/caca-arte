name: Diagnostico temporario
on:
  push:
    paths: [".github/workflows/diag-temp.yml"]
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          import urllib.request, urllib.parse, http.cookiejar, re
          cj=http.cookiejar.CookieJar(); op=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(cj))
          op.addheaders=[("User-Agent","Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36"),("Referer","https://www.livrariaalfarrabista.com/")]
          home=op.open("https://www.livrariaalfarrabista.com/",timeout=20).read().decode("latin-1")
          print("cookies:",[c.name for c in cj]); print("falta na home:", "Falta a pesquisa" in home)
          for name,data in [("Tpesq",{"Tpesq":"Cruzeiro Seixas"}),("Tpesq+b",{"Tpesq":"Cruzeiro Seixas","b1":"Pesquisar"})]:
            raw=op.open("https://www.livrariaalfarrabista.com/?tipo=pesql",data=urllib.parse.urlencode(data,encoding="latin-1").encode(),timeout=20).read().decode("latin-1")
            i=raw.find("Falta a pesquisa"); print(name,len(raw),"falta" if i>=0 else "ok", re.sub(r"\s+"," ",raw[max(0,i-300):i+100]) if i>=0 else "")
            links=sorted(set(re.findall(r"href=['\"]([^'\"]*(?:livro|ref=|tipo=liv|det)[^'\"]*)['\"]",raw)))
            print(" links:",links[:12])
            j=raw.lower().find("seixas"); print(" ctx:",re.sub(r"\s+"," ",raw[max(0,j-400):j+300]) if j>=0 else "sem 'seixas'")
          PY
